name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # O site é estático (sem build): publica só o que a página usa,
      # deixando de fora roteiro, instruções de agente e configs locais.
      - name: Montar artefato
        run: |
          mkdir _site
          cp -r *.html .nojekyll css js _site/
          [ -d assets ] && cp -r assets _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
